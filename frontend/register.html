<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Đăng ký — PIXELKEY</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page">

  <header class="navbar">

    <div class="container nav-inner">

      <a href="./index.html" class="logo">
        <span class="logo-pixel">PIXEL</span>KEY
      </a>

      <a
        href="./index.html"
        class="btn btn-outline"
      >
        ← Trang chủ
      </a>

    </div>

  </header>


  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-header">

        <div class="section-label">
          PIXELKEY ACCOUNT
        </div>

        <h1>Tạo tài khoản</h1>

        <p>
          Đăng ký tài khoản để bắt đầu mua game.
        </p>

      </div>


      <form id="registerForm">

        <div class="form-group">

          <label for="registerUsername">
            Username
          </label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Ví dụ: tuan123"
            autocomplete="username"
            minlength="3"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerPassword">
            Mật khẩu
          </label>

          <input
            id="registerPassword"
            type="password"
            placeholder="Ít nhất 8 ký tự"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <div class="form-group">

          <label for="registerPasswordConfirm">
            Nhập lại mật khẩu
          </label>

          <input
            id="registerPasswordConfirm"
            type="password"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <div
          id="registerMessage"
          class="form-message"
        ></div>


        <button
          type="submit"
          class="btn btn-primary auth-submit"
        >
          Tạo tài khoản
        </button>

      </form>


      <div class="auth-footer">

        Đã có tài khoản?

        <a href="./login.html">
          Đăng nhập
        </a>

      </div>

    </div>

  </main>


  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>

</body>
</html>
